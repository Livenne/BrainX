[package]
name = "brainx-client-daemon"
version = "0.1.0"
edition = "2021"
description = "brainx C-side local daemon prototype"
license = "UNLICENSED"

[[bin]]
name = "brainx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
